name: RaceDay Part 3 - Build Test and Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore solution
        run: dotnet restore RaceDayAuthAPI.sln
      - name: Build API, MVC and tests
        run: dotnet build RaceDayAuthAPI.sln -c Release --no-restore
      - name: Run automated API tests
        env:
          Jwt__Key: RaceDay-CI-Dedicated-Testing-Key-Change-For-Production-2026
          Jwt__Issuer: RaceDayApi
          Jwt__Audience: RaceDayClient
        run: dotnet test RaceDayAuthAPI.Tests/RaceDayAuthAPI.Tests.csproj -c Release --no-build --logger "trx;LogFileName=Part3Tests.trx" --results-directory TestResults
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceDay-Part3-TestResults
          path: TestResults/
          if-no-files-found: warn

  mvc-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build MVC container
        run: docker build -f RaceDayMVC/Dockerfile -t raceday-mvc:part3 .
