name: RaceDay Part 1 Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          echo "Checking RaceDay Part 1 submission structure..."

          test -d docs
          test -f docs/API_Endpoint_Plan.md
          test -f docs/RaceDay_Database.sql

          test -f README.md

          echo "All required Part 1 files are present."
          echo "RaceDay Part 1 validation successful."
